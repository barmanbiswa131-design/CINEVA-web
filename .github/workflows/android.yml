name: Build CINEVA Android Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build CINEVA debug APK with AdMob test ads
        run: gradle :app:assembleDebug

      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINEVA-APK-Test-Only
          path: app/build/outputs/apk/debug/app-debug.apk
