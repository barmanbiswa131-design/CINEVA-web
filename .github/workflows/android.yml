name: Build CINEVA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Publish CINEVA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINEVA-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK for GitHub Pages
        run: cp app/build/outputs/apk/debug/app-debug.apk web/CINEVA.apk

      - name: Commit APK
        uses: EndBug/add-and-commit@v9
        with:
          add: "web/CINEVA.apk"
          message: "Build CINEVA Android APK"
          default_author: github_actions
