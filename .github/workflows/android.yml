name: Build CINEVA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare persistent signing key
        env:
          CINEVA_KEYSTORE_BASE64: ${{ secrets.CINEVA_KEYSTORE_BASE64 }}
        run: |
          test -n "$CINEVA_KEYSTORE_BASE64" || { echo "CINEVA_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$CINEVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cineva-release.jks"

      - name: Build signed CINEVA release APK
        env:
          CINEVA_KEYSTORE_FILE: ${{ runner.temp }}/cineva-release.jks
          CINEVA_KEYSTORE_PASSWORD: ${{ secrets.CINEVA_KEYSTORE_PASSWORD }}
          CINEVA_KEY_ALIAS: ${{ secrets.CINEVA_KEY_ALIAS }}
          CINEVA_KEY_PASSWORD: ${{ secrets.CINEVA_KEY_PASSWORD }}
        run: |
          test -n "$CINEVA_KEYSTORE_PASSWORD" || { echo "CINEVA_KEYSTORE_PASSWORD secret is missing."; exit 1; }
          test -n "$CINEVA_KEY_ALIAS" || { echo "CINEVA_KEY_ALIAS secret is missing."; exit 1; }
          test -n "$CINEVA_KEY_PASSWORD" || { echo "CINEVA_KEY_PASSWORD secret is missing."; exit 1; }
          gradle :app:assembleRelease

      - name: Publish CINEVA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINEVA-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Copy APK for GitHub Pages
        run: cp app/build/outputs/apk/release/app-release.apk web/CINEVA.apk

      - name: Commit APK
        uses: EndBug/add-and-commit@v9
        with:
          add: "web/CINEVA.apk"
          message: "Build signed CINEVA Android APK"
          default_author: github_actions
