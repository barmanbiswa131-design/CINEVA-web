plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'com.movieapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.movieapp'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.6"
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("CINEVA_KEYSTORE_FILE")
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("CINEVA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CINEVA_KEY_ALIAS")
                keyPassword System.getenv("CINEVA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
